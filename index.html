<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- meta: filled in per page by scripts/prerender.mjs after the build -->
    <title>Jagdish Patil — AI-native builder, aspiring Forward Deployed Engineer</title>
    <meta name="description" content="Jagdish Patil builds AI agents and web apps, AI-assisted, and ships them live. An AI-native builder in Surat, India, working toward Forward Deployed Engineering." />
    <!-- /meta -->
    <meta name="theme-color" content="#0B0B0F" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme (or ?theme=light) before first paint. Dark is the default.
      try {
        var t = new URLSearchParams(location.search).get("theme") || localStorage.getItem("theme")
        if (t === "light") {
          document.documentElement.dataset.theme = "light"
          document.querySelector("meta[name=theme-color]").setAttribute("content", "#f3f2ee")
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />


    <link rel="preload" href="/fonts/clash-display-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/yesteryear-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
